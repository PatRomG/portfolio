<!DOCTYPE html>
<html lang="ca">
<head> 
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacte - Portfolio</title>

    <!-- Enlaces a otros archivos -->
     <link rel="stylesheet" href="../css/common.css">
    <link rel="stylesheet" href="../css/CONTACTPAGE.css">

    <!-- Scripts -->
    <script src="../js/common.js"></script>
    <script src="../js/CONTACTPAGE.js"></script>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600;1,700&family=Fredericka+the+Great&family=Just+Me+Again+Down+Here&family=Liu+Jian+Mao+Cao&family=Nova+Square&family=Pixelify+Sans:wght@400..700&family=Quantico:ital,wght@0,400;0,700;1,400;1,700&family=VT323&display=swap" rel="stylesheet">
</head>

<body data-page="contact">
    <!-- HEADER: Controles superiores -->
    <header class="top-controls">
        <!-- Modo oscuro/claro -->
        <img id="mode-toggle" src="../icons/dark.svg" alt="Toggle dark mode" class="control-icon">

        <!-- Selector de idioma -->
        <img id="languageMode" src="../icons/lang_en.svg" alt="Toggle language" class="control-icon">

        <!-- Menú de idiomas (oculto por defecto) -->
        <div id="language-menu" class="language-dropdown">
            <button class="lang-btn" data-lang="en">
                <img src="../photos/uk-flag.png" alt="UK flag" class="flag-icon">English
            </button>
            <button class="lang-btn" data-lang="es">
                <img src="../photos/es-flag.png" alt="ES flag" class="flag-icon">Español
            </button>
            <button class="lang-btn" data-lang="fr">
                <img src="../photos/fr-flag.png" alt="FR flag" class="flag-icon">Français
            </button>
            <button class="lang-btn" data-lang="ca">
                <img src="../photos/val-flag.png" alt="VAL flag" class="flag-icon">Valencià
            </button>
            <button class="lang-btn" data-lang="zh">
                <img src="../photos/zh-flag.png" alt="ZH flag" class="flag-icon">中文/普通话
            </button>
        </div>

        <!-- LinkedIn -->
        <img id="Linkedin" src="../icons/linkedin.svg" alt="Linkedin" class="control-icon linkedin-icon">
    </header>

    <!-- CONTENIDO PRINCIPAL -->
    <main>
        <form id="contact-form" class="contact-form" action="https://formspree.io/f/mqawjbgl" method="POST">
            <h1>PARLEM!</h1>
            <h2>Si tens alguna cosa que comentar-me, un email sempre serà benvingut!</h2>

            <label for="name">Nom</label>
            <input type="text" id="name" name="name" placeholder="El teu nom" required><br><br>

            <label for="subject">Assumpte</label>
            <input type="text" id="subject" name="subject" placeholder="De què es tracta?" required><br><br>

            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="el.teu.email@exemple.com" required><br><br>

            <label for="message">Missatge</label>
            <textarea id="message" name="message" rows="4" placeholder="El teu missatge..." required></textarea><br><br><br>

            <!-- Campos ocultos de Formspree -->
            <input type="hidden" name="_next" value="https://PatRomG.github.io/portfolio/p2.contact/CONTACTPAGE_ca.html?success=true">
            <input type="hidden" name="_subject" value="New contact from portfolio!">
            <input type="hidden" name="_captcha" value="false">

            <button type="submit">Enviar</button>
        </form>

        <div class="under-form">
            <img id="contact-icon" src="../icons/contact.svg" alt="Contact Icon">
            <p id="email-under-form">patriciaromerogonzalez02@gmail.com</p>
        </div>
        
    </main>

    <!-- FOOTER: Barra inferior tipo sistema operativo -->
    <footer class="system-footer">
        <div class="footer-content">
            <!-- Logo izquierda -->
            <div class="footer-left">
                <img id="logo" src="../photos/loto.png" alt="Logo" class="footer-logo">
            </div>

            <!-- Iconos de navegación centro-izquierda -->
            <div class="footer-nav">
                <a href="../p0.mainpage/MAINPAGE_ca.html">
                    <img src="../icons/casa.svg" alt="Main Page" class="footer-nav-icon" id="footer-home">
                </a>
                <a href="../p1.aboutme/ABOUTMEPAGE_ca.html">
                    <img src="../icons/user.svg" alt="About Me Page" class="footer-nav-icon" id="footer-about">
                </a>
                <a href="../p2.contact/CONTACTPAGE_ca.html">
                    <img src="../icons/contact.svg" alt="Contact Page" class="footer-nav-icon" id="footer-contact">
                </a>
                <a href="../p3.portfolio/PORTFOLIO_ca.html">
                    <img src="../icons/folder.svg" alt="My Works Page" class="footer-nav-icon" id="footer-works">
                </a>
            </div>

            <!-- Reproductor de música centro -->
            <div class="footer-player">
                <audio id="music-player" preload="metadata"></audio>
                
                <div class="player-info">
                    <p id="song-title">Song - Artist</p>
                </div>
                
                <div class="player-controls">
                    <img id="prev-button" src="../icons/prev.svg" alt="Previous Button" class="player-btn">
                    <img id="play-pause-button" src="../icons/play.svg" alt="Play/Pause Button" class="player-btn">
                    <img id="next-button" src="../icons/next.svg" alt="Next Button" class="player-btn">
                    <img id="loop-button" src="../icons/loop.svg" alt="Loop" class="loop-btn" title="Toggle loop">
                    <!--<img id="pause-button" src="icons/pause.svg" alt="Pause Button" class="player-btn" style="display:none;">-->
                </div>

                <!-- Progress bar -->
                 <div class="progress-container">
                    <span id="current-time" class="time-display">0:00</span>
                    <input type="range" id="progress-bar" min="0" max="100" value="0">
                    <span id="duration" class="time-display">0:00</span>
                 </div>
            </div>

            <!-- Sistema de info derecha -->
            <div class="footer-right">
                <p id="current-datetime"></p>
                <img id="wifi" src="../icons/wifi.svg" alt="WiFi Status" class="system-icon">
                <img id="volume" src="../icons/volume_up.svg" alt="Volume Control" class="system-icon">
                <div id="volume-bar" class="volume-bar">
                    <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="1">
                </div>
            </div>
        </div>
    </footer>

</body>
</html>
